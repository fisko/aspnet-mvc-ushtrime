<svg xmlns="http://www.w3.org/2000/svg" width="940" height="385" viewBox="0 0 940 385" role="img" aria-label="Struktura e një JWT: header, payload, signature" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs>
<rect width="940" height="385" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Anatomia e një JWT:  HEADER . PAYLOAD . SIGNATURE</text>
<rect x="20" y="50" width="900" height="44" rx="8" fill="#f6f8fa" stroke="#9a9a9a" stroke-width="1.25"/>
<text x="36" y="78" font-size="14" font-family="Consolas, monospace"><tspan fill="#d32f2f">eyJhbGciOiJIUzI1NiIs...</tspan><tspan fill="#1f2328">.</tspan><tspan fill="#7b3fa0">eyJzdWIiOiI4ZjEyLi4uIiwiZW1haWwiOi...</tspan><tspan fill="#1f2328">.</tspan><tspan fill="#2f6fd6">SflKxwRJSMeKKF2QT4fwpM...</tspan></text>
<rect x="20" y="120" width="285" height="215" rx="8" fill="#ffffff" stroke="#d32f2f" stroke-width="1.5"/>
<text x="162" y="145" font-size="13.5" font-weight="700" fill="#d32f2f" text-anchor="middle">HEADER</text>
<text x="36" y="172" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">{</text>
<text x="36" y="191" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">  "alg": "HS256",</text>
<text x="36" y="210" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">  "typ": "JWT"</text>
<text x="36" y="229" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">}</text>
<text x="162" y="322" font-size="10.5" font-weight="600" fill="#59636e" text-anchor="middle">algoritmi i nënshkrimit</text>
<rect x="327" y="120" width="285" height="215" rx="8" fill="#ffffff" stroke="#7b3fa0" stroke-width="1.5"/>
<text x="469" y="145" font-size="13.5" font-weight="700" fill="#7b3fa0" text-anchor="middle">PAYLOAD (claims)</text>
<text x="343" y="172" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">{</text>
<text x="343" y="191" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">  "sub": "8f12...",</text>
<text x="343" y="210" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">  "email": "admin@uni.test",</text>
<text x="343" y="229" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">  ".../claims/name": "admin@uni.test",</text>
<text x="343" y="248" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">  ".../claims/role": "Admin",</text>
<text x="343" y="267" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">  "iss": "University", "exp": 17...</text>
<text x="343" y="286" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">}</text>
<text x="469" y="322" font-size="10.5" font-weight="600" fill="#59636e" text-anchor="middle">Base64 - KUSHDO e lexon (jwt.io)!</text>
<rect x="634" y="120" width="285" height="215" rx="8" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="776" y="145" font-size="13.5" font-weight="700" fill="#2f6fd6" text-anchor="middle">SIGNATURE</text>
<text x="650" y="172" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">HMACSHA256(</text>
<text x="650" y="191" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">  header + "." + payload,</text>
<text x="650" y="210" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">  Jwt:Key   ← sekreti</text>
<text x="650" y="229" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="Consolas, monospace">)</text>
<text x="776" y="322" font-size="10.5" font-weight="600" fill="#59636e" text-anchor="middle">ndrysho 1 shkronjë → 401</text>
<path d="M115 94V118" fill="none" stroke="#d32f2f" stroke-width="1.5"/>
<path d="M470 94V118" fill="none" stroke="#7b3fa0" stroke-width="1.5"/>
<path d="M776 94V118" fill="none" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="470" y="365" font-size="12" font-weight="600" fill="#b26a00" text-anchor="middle">Serveri kontrollon: nënshkrimin (Key), iss, aud, exp. Mos vendos kurrë fjalëkalime në payload!</text>
</svg>