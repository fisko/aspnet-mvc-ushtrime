<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="980" height="360" fill="#fff"/>
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Pipeline-i i ASP.NET Core: rruga e një kërkese HTTP</text>

  <!-- shfletuesi -->
  <rect x="15" y="110" width="110" height="90" rx="10" fill="#eceff1" stroke="#607d8b"/>
  <text x="70" y="148" text-anchor="middle" font-size="14" font-weight="bold">Shfletuesi</text>
  <text x="70" y="168" text-anchor="middle" font-size="12">ose klienti API</text>
  <text x="70" y="186" text-anchor="middle" font-size="11" fill="#555">GET /Students</text>

  <!-- middleware -->
  <g font-size="13">
    <rect x="150" y="100" width="120" height="110" rx="8" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="210" y="135" text-anchor="middle" font-weight="bold">UseHttps</text>
    <text x="210" y="152" text-anchor="middle" font-weight="bold">Redirection</text>
    <text x="210" y="178" text-anchor="middle" font-size="11">http → https</text>

    <rect x="290" y="100" width="120" height="110" rx="8" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="350" y="143" text-anchor="middle" font-weight="bold">UseRouting</text>
    <text x="350" y="170" text-anchor="middle" font-size="11">cili controller /</text>
    <text x="350" y="185" text-anchor="middle" font-size="11">action përputhet?</text>

    <rect x="430" y="100" width="130" height="110" rx="8" fill="#fff3e0" stroke="#fb8c00"/>
    <text x="495" y="135" text-anchor="middle" font-weight="bold">UseAuthentication</text>
    <text x="495" y="160" text-anchor="middle" font-size="11">KUSH je?</text>
    <text x="495" y="176" text-anchor="middle" font-size="11">lexon cookie / JWT</text>
    <text x="495" y="194" text-anchor="middle" font-size="10" fill="#777">(Pjesa 2)</text>

    <rect x="580" y="100" width="130" height="110" rx="8" fill="#fff3e0" stroke="#fb8c00"/>
    <text x="645" y="135" text-anchor="middle" font-weight="bold">UseAuthorization</text>
    <text x="645" y="160" text-anchor="middle" font-size="11">A KE LEJE?</text>
    <text x="645" y="176" text-anchor="middle" font-size="11">[Authorize], rolet</text>
    <text x="645" y="194" text-anchor="middle" font-size="10" fill="#777">401 / 403 ndalet këtu</text>

    <rect x="730" y="85" width="230" height="140" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
    <text x="845" y="112" text-anchor="middle" font-weight="bold">Endpoint (Controller)</text>
    <text x="845" y="136" text-anchor="middle" font-size="12">StudentsController.Index()</text>
    <text x="845" y="156" text-anchor="middle" font-size="11">↓ DI jep UniversityContext</text>
    <text x="845" y="174" text-anchor="middle" font-size="11">↓ EF Core → SQL Server</text>
    <text x="845" y="192" text-anchor="middle" font-size="11">↓ return View(...) / JSON</text>
  </g>

  <!-- shigjetat para -->
  <g stroke="#444" stroke-width="2" marker-end="url(#a)">
    <line x1="125" y1="140" x2="148" y2="140"/>
    <line x1="270" y1="140" x2="288" y2="140"/>
    <line x1="410" y1="140" x2="428" y2="140"/>
    <line x1="560" y1="140" x2="578" y2="140"/>
    <line x1="710" y1="140" x2="728" y2="140"/>
  </g>
  <text x="430" y="85" font-size="12" fill="#444">Kërkesa (Request) →</text>

  <!-- pergjigja -->
  <path d="M845,225 L845,265 L70,265 L70,202" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#g)"/>
  <text x="460" y="285" text-anchor="middle" font-size="12" fill="#2e7d32">← Përgjigja (Response: HTML ose JSON) kthehet nëpër të njëjtat middleware në rend të kundërt</text>

  <rect x="150" y="305" width="810" height="40" rx="6" fill="#fffde7" stroke="#fbc02d"/>
  <text x="555" y="331" text-anchor="middle" font-size="13">⚠ Rendi në Program.cs = rendi i ekzekutimit. UseAuthentication DUHET të jetë para UseAuthorization.</text>
</svg>
