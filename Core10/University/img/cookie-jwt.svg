<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img" aria-label="Krahasimi i autentikimit me Cookie dhe me JWT" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs>
<rect width="940" height="440" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Dy mënyra për të thënë "kush jam": Cookie (MVC) dhe JWT (API)</text>
<rect x="20" y="50" width="900" height="175" rx="8" fill="#f3faf3" stroke="#2e7d32" stroke-width="1.5"/>
<text x="36" y="74" font-size="13.5" font-weight="700" fill="#2e7d32" text-anchor="start">1) COOKIE - faqet MVC (/Account/Login)</text>
<rect x="40" y="90" width="150" height="115" rx="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.25"/>
<text x="115" y="140" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Shfletuesi</text>
<text x="115" y="160" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle">e ruan cookie-n vetë</text>
<rect x="750" y="90" width="150" height="115" rx="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.25"/>
<text x="825" y="140" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ASP.NET Core</text>
<text x="825" y="160" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle">Identity</text>
<path d="M192 112H748" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#g)"/>
<text x="470" y="106" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="Consolas, monospace">POST /Account/Login  (email + fjalëkalim)</text>
<path d="M748 146H192" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#g)"/>
<text x="470" y="140" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="Consolas, monospace">302 + Set-Cookie: .AspNetCore.Identity=...</text>
<path d="M192 180H748" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#g)"/>
<text x="470" y="174" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="Consolas, monospace">GET /Students   Cookie: .AspNetCore.Identity=...</text>
<text x="470" y="192" font-size="10" font-weight="400" fill="#59636e" text-anchor="middle">shfletuesi e dërgon cookie-n AUTOMATIKISHT</text>
<text x="470" y="218" font-size="10.5" font-weight="600" fill="#2e7d32" text-anchor="middle">I pakyçur → 302 te /Account/Login · Pa rol → 302 te /Account/AccessDenied</text>
<rect x="20" y="250" width="900" height="175" rx="8" fill="#f2f7fe" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="36" y="274" font-size="13.5" font-weight="700" fill="#2f6fd6" text-anchor="start">2) JWT BEARER - Web API (/api/...)</text>
<rect x="40" y="290" width="150" height="115" rx="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.25"/>
<text x="115" y="340" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Klienti API</text>
<text x="115" y="360" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle">JS, mobile, .http</text>
<rect x="750" y="290" width="150" height="115" rx="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.25"/>
<text x="825" y="340" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ASP.NET Core</text>
<text x="825" y="360" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle">JwtBearer</text>
<path d="M192 312H748" fill="none" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#b)"/>
<text x="470" y="306" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="Consolas, monospace">POST /api/auth/login  { email, password }</text>
<path d="M748 346H192" fill="none" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#b)"/>
<text x="470" y="340" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="Consolas, monospace">200 { "token": "eyJhbGciOi...", "expiresAtUtc": ... }</text>
<path d="M192 380H748" fill="none" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#b)"/>
<text x="470" y="374" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="Consolas, monospace">GET /api/students   Authorization: Bearer eyJhbGciOi...</text>
<text x="470" y="392" font-size="10" font-weight="400" fill="#59636e" text-anchor="middle">klienti duhet ta shtojë tokenin VETË në çdo kërkesë</text>
<text x="470" y="418" font-size="10.5" font-weight="600" fill="#2f6fd6" text-anchor="middle">Pa token / token i pavlefshëm → 401 · Token pa rolin e duhur → 403 (pa redirect, vetëm status)</text>
</svg>